name: articles-validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read    # for every trigger; no secret is in scope

concurrency:
  group: articles-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate the five articles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1; no credentials are needed, so none are kept
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - name: Install the pinned linter
        run: npm ci
      - name: Validate
        run: python3 -m tools.articles_ci validate

  selftest:
    name: prove the pipeline with no network
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      # No npm ci, no token, no remote: a bare repo and 127.0.0.1 only. The
      # linter is therefore absent here by design, so its one case reports a
      # skip; the validate job above installs it with npm ci and proves that
      # check for real. Every other case must run and pass in this job.
      - run: python3 -m tools.articles_ci selftest
